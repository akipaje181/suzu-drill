<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すずドリル</title>
<meta name="description" content="2年生 文しょうだい 自動まるつけ">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f6f2e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="すずドリル">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">

<style>
  html{color-scheme:light dark}
  body{margin:0}
  [hidden]{display:none !important}
  img{max-width:100%}
  :root{
    --paper:#ffffff; --ground:#f2eee4;
    --ink:#23211d; --ink-soft:#6f695d; --ink-faint:#9c9587;
    --rule:#ded7c6; --rule-soft:#ece6d8;
    --shu:#d4453a; --shu-ink:#c0392f; --shu-wash:#fbeeec;
    --ok-wash:#f0f4ec; --ok-ink:#3f7a52;
    --bar:#2e2b25; --bar-ink:#f3efe4;
    --field:#fdfcf8; --field-line:#c8c0ad; --grid:#e4ddcc;
    --f-round:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
    --f-kaku:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#27241f; --ground:#1a1815; --ink:#efeade; --ink-soft:#a9a293; --ink-faint:#7d7768;
      --rule:#403b32; --rule-soft:#332f28; --shu:#ef6b60; --shu-ink:#f08076; --shu-wash:#3a2723;
      --ok-wash:#22301f; --ok-ink:#8fc79f; --bar:#efeade; --bar-ink:#23211d;
      --field:#201e19; --field-line:#4d4739; --grid:#3a3529;
    }
  }
  :root[data-theme="dark"]{
    --paper:#27241f; --ground:#1a1815; --ink:#efeade; --ink-soft:#a9a293; --ink-faint:#7d7768;
    --rule:#403b32; --rule-soft:#332f28; --shu:#ef6b60; --shu-ink:#f08076; --shu-wash:#3a2723;
    --ok-wash:#22301f; --ok-ink:#8fc79f; --bar:#efeade; --bar-ink:#23211d;
    --field:#201e19; --field-line:#4d4739; --grid:#3a3529;
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--f-kaku); line-height:1.7;
    margin:0; padding:0 0 108px;
    -webkit-text-size-adjust:100%;
  }
  button, input{font:inherit; color:inherit; touch-action:manipulation}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--shu); outline-offset:2px}
  .wrap{max-width:760px; margin:0 auto; padding:0 14px}
  .linkbtn{background:none; border:0; padding:6px 10px; font:inherit; font-size:13px; color:var(--ink-soft); text-decoration:underline; cursor:pointer}
  .linkbtn.shu{color:var(--shu-ink)}
  h2.sec{font-family:var(--f-round); font-size:18px; font-weight:700; margin:22px 0 10px}
  h2.sec small{font-family:var(--f-kaku); font-size:12px; font-weight:500; color:var(--ink-soft); margin-left:8px}
  .muted{color:var(--ink-soft); font-size:13px}

  /* ---------- header ---------- */
  .top{background:var(--bar); color:var(--bar-ink); padding:12px 0 10px; position:sticky; top:0; z-index:20}
  .top .wrap{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .top h1{font-family:var(--f-round); font-size:18px; font-weight:700; margin:0; letter-spacing:.04em}
  .back{
    font-family:var(--f-round); font-size:15px; font-weight:700; color:var(--bar-ink);
    background:transparent; border:1.5px solid currentColor; border-radius:999px; padding:5px 14px 5px 10px; min-height:38px; opacity:.85;
  }
  .tabs{display:flex; gap:6px; margin-left:auto}
  .tab{
    font-family:var(--f-round); font-size:15px; font-weight:500;
    background:transparent; color:var(--bar-ink); opacity:.62;
    border:1.5px solid currentColor; border-radius:999px; padding:6px 14px; min-height:38px;
  }
  .tab[aria-pressed="true"]{opacity:1; background:var(--shu); border-color:var(--shu); color:#fff}
  .tabs.inpage .tab{color:var(--ink); opacity:.75}
  .tabs.inpage .tab[aria-pressed="true"]{color:#fff; opacity:1}

  /* ---------- home ---------- */
  .hello{font-family:var(--f-round); font-size:15px; color:var(--ink-soft); margin:18px 0 12px}
  .hello b{color:var(--ink); font-size:17px}
  .tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(215px, 1fr)); gap:12px}
  .tile{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    min-height:128px; padding:16px 16px 14px; border-radius:16px; text-align:left;
    background:var(--paper); border:1.5px solid var(--rule); color:var(--ink);
  }
  .tile svg{width:34px; height:34px; color:var(--shu-ink)}
  .tile b{font-family:var(--f-round); font-size:20px; font-weight:700; line-height:1.3}
  .tile span{font-size:13px; color:var(--ink-soft); line-height:1.5}
  .tile.primary{background:var(--shu); border-color:var(--shu); color:#fff}
  .tile.primary svg, .tile.primary span{color:rgba(255,255,255,.88)}
  .tile .badge{display:inline-block; margin-top:auto; font-size:12px; color:var(--shu-ink); font-weight:700}

  /* ---------- sheet picker ---------- */
  .pick{background:var(--paper); border-bottom:1px solid var(--rule)}
  .pick .wrap{padding-top:10px; padding-bottom:10px}
  .pick-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
  .chip{
    flex:none; width:56px; height:56px; border-radius:12px;
    border:1.5px solid var(--rule); background:var(--field);
    font-family:var(--f-round); font-size:15px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .chip small{font-family:var(--f-kaku); font-size:10px; font-weight:500; color:var(--ink-faint); line-height:1}
  .chip.done small{color:var(--ok-ink)}
  .chip.full{border-color:var(--ok-ink)}
  .chip[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}
  .chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}

  /* ---------- problems ---------- */
  .sheet-hd{display:flex; align-items:baseline; gap:10px; margin:18px 0 10px; font-family:var(--f-round)}
  .sheet-hd h2{font-size:19px; font-weight:700; margin:0}
  .sheet-hd span{font-size:13px; color:var(--ink-soft); font-family:var(--f-kaku)}
  .q{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px 15px 15px; margin-bottom:12px; position:relative}
  .q-hd{display:flex; align-items:flex-start; gap:9px}
  .q-n{
    flex:none; width:30px; height:30px; border-radius:50%; border:2px solid var(--shu); color:var(--shu-ink);
    font-family:var(--f-round); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .q-t{font-family:var(--f-round); font-size:16.5px; line-height:1.85; line-break:strict; flex:1; margin:0}
  .q-type{position:absolute; top:-9px; left:14px; font-size:11px; color:var(--ink-soft); background:var(--paper); padding:0 6px; border-radius:6px}
  .row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:13px 0 0 39px}
  .row .lbl{font-family:var(--f-round); font-size:15px; color:var(--ink-soft); flex:none}
  .num{width:96px; height:52px; text-align:center; font-family:var(--f-round); font-size:22px; font-weight:700; background:var(--field); border:2px solid var(--field-line); border-radius:10px}
  .num::placeholder{color:var(--ink-faint); font-weight:400; font-size:16px}
  .unit{font-family:var(--f-round); font-size:17px; font-weight:500}
  .opts{display:flex; gap:8px; flex-wrap:wrap}
  .opt{font-family:var(--f-round); font-size:16px; font-weight:500; min-height:52px; padding:8px 16px; border-radius:10px; border:2px solid var(--field-line); background:var(--field)}
  .opt[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}

  /* ---------- handwriting pad ---------- */
  .pad{margin:12px 0 0; border:1.5px dashed var(--field-line); border-radius:10px; overflow:hidden; background:var(--field)}
  .pad-bar{display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px dashed var(--rule)}
  .pad-lbl{font-family:var(--f-round); font-size:12.5px; color:var(--ink-faint); margin-right:auto; padding-left:2px}
  .tool{min-height:38px; padding:4px 13px; border-radius:8px; font-size:14px; font-family:var(--f-round); border:1.5px solid var(--field-line); background:var(--paper); color:var(--ink)}
  .tool[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .tool.clear{color:var(--shu-ink)}
  .pad-cv{
    display:block; width:100%; height:200px; touch-action:none; user-select:none; -webkit-user-select:none;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:30px 30px; background-position:-1px -1px;
  }

  /* ---------- marking ---------- */
  .q.ok{border-color:var(--ok-ink)}
  .q.ng{border-color:var(--shu); background:var(--shu-wash)}
  .mark{position:absolute; top:10px; right:12px; font-size:34px; line-height:1; font-weight:700}
  .mark.o{width:32px; height:32px; border:4px solid var(--ok-ink); border-radius:50%; top:12px}
  .mark.x{color:var(--shu-ink)}
  .q.graded .num, .q.graded .opt{pointer-events:none}
  .q.ng .num, .q.ng .opt{border-color:var(--shu); opacity:.75}
  .fix{margin:12px 0 0 39px; padding:11px 13px; border-radius:9px; background:var(--paper); border:1px dashed var(--shu); font-family:var(--f-round); font-size:15px; line-height:1.8}
  .fix .k{color:var(--ink-soft); font-size:13px; font-family:var(--f-kaku); margin-right:6px}
  .fix .a{color:var(--shu-ink); font-weight:700; font-size:17px}
  .fix .st{display:block; margin-top:4px; color:var(--ink-soft); font-size:14px}
  .fix .st em{font-style:normal; color:var(--ink); font-weight:500}
  .fix .go{display:block; margin-top:6px}

  /* ---------- result + action bar ---------- */
  .score{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .score .big{font-family:var(--f-round); font-size:30px; font-weight:700; line-height:1}
  .score .big i{font-style:normal; font-size:17px; color:var(--ink-soft)}
  .score .msg{font-family:var(--f-round); font-size:16px; flex:1; min-width:140px}
  .score.all .big{color:var(--ok-ink)}
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--paper); border-top:1px solid var(--rule); padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .bar .wrap{display:flex; gap:10px; padding:0}
  .btn{flex:1; min-height:56px; border-radius:12px; border:2px solid var(--shu); background:var(--shu); color:#fff; font-family:var(--f-round); font-size:19px; font-weight:700}
  .btn.ghost{background:transparent; color:var(--shu-ink)}
  .btn.sm{flex:none; min-height:48px; font-size:16px; padding:0 18px}
  .btn[disabled]{opacity:.4}
  .note{font-size:12px; color:var(--ink-faint); text-align:center; margin:18px 0 6px}

  /* ---------- weak mode ---------- */
  .panel{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:16px 0 12px}
  .panel h3{font-family:var(--f-round); font-size:17px; margin:0 0 8px}
  .klist{display:flex; flex-direction:column; gap:6px; margin:6px 0 12px}
  .krow{display:flex; align-items:center; gap:10px; font-family:var(--f-round); font-size:16px}
  .krow .rate{margin-left:auto; font-family:var(--f-kaku); font-size:13px; color:var(--ink-soft); white-space:nowrap}
  .krow .rate.weak{color:var(--shu-ink); font-weight:700}
  .pill{display:inline-block; font-size:11px; font-weight:700; color:var(--shu-ink); border:1.5px solid var(--shu); border-radius:999px; padding:0 8px; line-height:18px}

  /* ---------- lessons ---------- */
  .llist{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .lrow{display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--paper); border:1px solid var(--rule); border-radius:12px; text-align:left; font-family:var(--f-round); font-size:17px; font-weight:700; color:var(--ink)}
  .lrow .n{flex:none; width:28px; height:28px; border-radius:50%; background:var(--shu-wash); color:var(--shu-ink); font-size:13px; display:flex; align-items:center; justify-content:center}
  .lrow .st{margin-left:auto; font-family:var(--f-kaku); font-size:12px; font-weight:500; color:var(--ink-soft); white-space:nowrap}
  .lrow .st.weak{color:var(--shu-ink); font-weight:700}
  .lesson h2{font-family:var(--f-round); font-size:21px; margin:18px 0 6px; text-wrap:balance}
  .lesson .eyebrow{display:inline-block; font-family:var(--f-round); font-size:12px; font-weight:700; color:var(--shu-ink); border:1.5px solid var(--shu); border-radius:3px; padding:1px 8px; letter-spacing:.06em; margin-top:16px}
  .lesson .why{font-family:var(--f-round); font-size:16.5px; line-height:1.9; line-break:strict; margin:6px 0 0}
  .lesson .ex{margin:14px 0 0; background:var(--shu-wash); border:1px solid rgba(212,69,58,.35); border-radius:10px; padding:12px 16px; font-family:var(--f-round); font-size:16px; line-height:2}
  .lesson .ex .h{font-size:12px; color:var(--shu-ink); font-weight:700; letter-spacing:.06em; margin-bottom:2px; font-family:var(--f-kaku)}
  .lesson .ex em{font-style:normal; color:var(--shu-ink); font-weight:700}
  .lesson .ng{margin:12px 0 0; font-family:var(--f-round); font-size:15px; color:var(--ink-soft); line-height:1.8}
  .lesson .ng b{color:var(--shu-ink)}
  .lesson .try{margin-top:22px}
  .lesson .actions{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 0}

  /* ---------- records ---------- */
  .stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:14px}
  .stat{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:12px 14px}
  .stat b{display:block; font-family:var(--f-round); font-size:26px; line-height:1.2}
  .stat b i{font-style:normal; font-size:14px; color:var(--ink-soft); font-weight:500}
  .stat span{font-size:12px; color:var(--ink-soft)}
  .trow{display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--rule-soft); width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left; color:var(--ink)}
  .trow .nm{font-family:var(--f-round); font-size:16px; font-weight:700}
  .trow .nm .pill{margin-left:8px; vertical-align:2px}
  .trow .rt{font-size:13px; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums}
  .bar-bg{grid-column:1 / -1; height:8px; background:var(--rule-soft); border-radius:4px; overflow:hidden}
  .bar-fg{height:100%; background:var(--ok-ink); border-radius:4px}
  .bar-fg.weak{background:var(--shu)}
  .day{margin-top:14px}
  .day h4{font-family:var(--f-round); font-size:14px; color:var(--ink-soft); margin:0 0 4px; font-weight:700}
  .lg{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--rule-soft); font-size:14px}
  .lg .tm{color:var(--ink-faint); font-variant-numeric:tabular-nums; width:44px}
  .lg .wh{font-family:var(--f-round); font-weight:700}
  .lg .sc{margin-left:auto; font-family:var(--f-round); font-weight:700; font-variant-numeric:tabular-nums}
  .lg .sc.all{color:var(--ok-ink)}
  .lg .wr{font-size:12px; color:var(--shu-ink)}
  .grid5{display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin:6px 0 10px}
  .cell{border:1.5px solid var(--rule); border-radius:10px; padding:6px 4px; text-align:center; font-family:var(--f-round); font-size:13px; background:var(--field)}
  .cell b{display:block; font-size:15px}
  .cell.full{border-color:var(--ok-ink); color:var(--ok-ink)}
  .cell.none{color:var(--ink-faint)}
  .rec-actions{display:flex; gap:12px; justify-content:center; margin:22px 0 10px; flex-wrap:wrap}

  /* ---------- print view ---------- */
  .pctl .opt-row{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; margin:12px 0}
  .pctl label{display:inline-flex; align-items:center; gap:8px; font-family:var(--f-round); font-size:15px}
  .pctl input[type=checkbox]{width:22px; height:22px; accent-color:var(--shu)}
  .pctl .src{display:flex; gap:8px; flex-wrap:wrap}
  .pdfs{margin:16px 0 20px}
  .pdfs .rowp{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--rule-soft)}
  .pdfs .rowp b{font-family:var(--f-round); width:56px}
  .pdfs a{font-family:var(--f-round); font-size:14px; color:var(--shu-ink); border:1.5px solid var(--shu); border-radius:999px; padding:4px 12px; text-decoration:none; min-height:36px; display:inline-flex; align-items:center}
  #printArea{margin:14px auto 0; width:210mm; max-width:100%}
  .psheet{
    position:relative; width:210mm; min-height:297mm; padding:13mm 15mm 12mm; margin:0 0 8mm;
    background:#fff; color:#23211d; box-shadow:0 1px 2px rgba(35,33,29,.1), 0 10px 26px rgba(35,33,29,.13);
    font-size:10pt; font-family:var(--f-kaku); line-height:1.7;
  }
  .psheet .head{display:flex; align-items:flex-end; gap:10mm; border-bottom:1.6pt solid #23211d; padding-bottom:2.2mm}
  .psheet .ttl{font-family:var(--f-round); font-weight:700; font-size:14pt; letter-spacing:.06em; margin:0; color:#23211d}
  .psheet .no{margin-left:auto; font-family:var(--f-round); font-weight:700; font-size:11pt; color:#c0392f; border:1.4pt solid #d4453a; border-radius:2px; padding:.6mm 2.6mm; letter-spacing:.08em; white-space:nowrap}
  .psheet .meta{display:flex; align-items:baseline; gap:7mm; margin-top:3mm; font-size:9pt; color:#6f695d}
  .psheet .fill{border-bottom:.8pt solid #cfc8b8; display:inline-block}
  .psheet .d{width:9mm} .psheet .nm{flex:1; min-width:40mm}
  .psheet .sc{border:.9pt solid #cfc8b8; padding:1mm 3mm; white-space:nowrap}
  .psheet .probs{display:flex; flex-direction:column; gap:3.5mm; margin-top:4mm}
  .psheet .p{display:grid; grid-template-columns:1fr 62mm; grid-template-rows:auto auto; column-gap:5mm; row-gap:2mm}
  .psheet .pt{grid-column:1; grid-row:1; display:flex; gap:2.6mm; align-items:flex-start; font-family:var(--f-round); font-size:10.5pt; line-height:1.74; line-break:strict; text-align:justify}
  .psheet .pn{font-weight:700; font-size:11pt; color:#c0392f; flex:none; line-height:1.6}
  .psheet .lines{grid-column:1; grid-row:2; padding-left:6.6mm; display:flex; flex-direction:column; justify-content:space-between; gap:2.5mm}
  .psheet .ln{display:flex; align-items:flex-end; gap:2mm; min-height:10mm}
  .psheet .ln .lbl{font-family:var(--f-round); font-size:10pt; color:#6f695d; flex:none; white-space:nowrap}
  .psheet .ln .rule{flex:1; border-bottom:1pt solid #cfc8b8; min-height:9.5mm}
  .psheet .ln.ans .lbl{color:#23211d}
  .psheet .ln.ans .rule{border-bottom-width:1.4pt; border-bottom-color:#9c9587}
  .psheet .hs{grid-column:2; grid-row:1 / 3; border:1pt dashed #cfc8b8; position:relative; min-height:36mm; padding:3.4mm 2mm 2mm}
  .psheet .hs span{position:absolute; top:.8mm; left:1.6mm; font-family:var(--f-round); font-size:8pt; color:#9c9587}
  .psheet .ak{margin-top:6mm; border:.9pt solid #e7e1d3}
  .psheet .ak h4{font-family:var(--f-round); font-weight:700; font-size:10pt; margin:0; background:#fbeeec; color:#c0392f; padding:1.4mm 3mm; border-bottom:.9pt solid #eed6d2}
  .psheet .ak table{width:100%; border-collapse:collapse; font-size:9.5pt; font-variant-numeric:tabular-nums}
  .psheet .ak td{padding:1.8mm 3mm; vertical-align:top; border-top:.6pt solid #e7e1d3}
  .psheet .ak tr:first-child td{border-top:0}

  var LESSONS = {"kago":{"title":"かご＋ばら の もんだい","why":"かごや はこの 中身を ぜんぶ たしてから、ばらの 分を たします。それから 食べた 分を ひきます。「一人 2こずつ」の ときは、食べた 数も 2+2+2… で 先に 出します。","ex":["1かご 6こ が 2かご → <em>6+6=12</em>","ばらの 3こを たして <em>12+3=15</em>","5人が 1こずつ 食べたので <em>15-5=10</em>","こたえ <em>10こ</em>"],"ng":"1かご分だけで <b>6-5</b> と しない。かごが 2つなら 2かご分を たす。","try":{"t":0,"s":1,"i":0}},"sorezore":{"title":"「それぞれ 〜ずつ」の もんだい","why":"「あさと ひるに それぞれ 7こずつ」は、あさに 7こ、ひるに 7こ。ぜんぶで 2回 へって います。だから ひき算も 2回 します。","ex":["<em>53-7=46</em>","つづけて <em>46-7=39</em>","こたえ <em>39こ</em>"],"ng":"1回だけ ひいて <b>46</b> で 止まらない。「それぞれ」は 2人分・2回分。","try":{"t":0,"s":1,"i":1}},"dochira":{"title":"「どちらが どれだけ 多い」の もんだい","why":"ひき算を 2回 します。①あわせた 数から わかって いる ほうを ひいて、もう一方の 数を 出す。②大きい ほうから 小さい ほうを ひく。③「どちらが」も こたえに 書く。","ex":["金魚の 数 → <em>120-40=80</em>","くらべる → <em>80-40=40</em>","こたえ <em>金魚が 40ぴき 多い</em>"],"ng":"1回目の <b>80</b> を こたえに しない。多い ほうの 名前も まちがえない。","try":{"t":0,"s":1,"i":2}},"aida":{"title":"いちれつの「あいだの 数」","why":"れつに ならんだ 人の あいだの 数は、人数より 1 少ない（○|○|○ は 3人で あいだ 2つ）。そこに 1人ずつ 入るので、もとの 人数に あいだの 数を たします。","ex":["あいだ → <em>35-1=34</em>","みんなで → <em>35+34=69</em>","こたえ <em>69人</em>"],"ng":"<b>35-1=34</b> で 止まらない（人は ふえる）。あいだの 数を 出した しきも 書く。","try":{"t":0,"s":1,"i":3}},"wa":{"title":"わ（丸）の「あいだの 数」","why":"わに なると、さいごの 人と さいしょの 人も となり合います。だから あいだの 数は 人数と 同じ。いちれつ（−1）と ちがう ところです。","ex":["36人が わ → あいだも <em>36</em>","みんなで → <em>36+36=72</em>","こたえ <em>72人</em>"],"ng":"いちれつと 同じに <b>36-1=35</b> と しない。","try":{"t":1,"s":1,"i":0}},"nagasa_hiki":{"title":"長さの ひき算（cm と mm）","why":"cmは cmどうし、mmは mmどうしで ひきます。ひっさんは cmと mmを たてに そろえて 書きます。mmが 0に なったら、cmだけ 書きます。","ex":["cm → <em>15-5=10</em>　mm → <em>8-5=3</em>","こたえ <em>10cm3mm</em>","57cm9mm − 6cm9mm なら mmは 0 → こたえ <em>51cm</em>"],"ng":"mmの ひき算を <b>8-5=4</b> の ように ずらさない。<b>51cm0mm</b> とは 書かない。","try":{"t":0,"s":1,"i":4}},"nagasa_tashi":{"title":"長さの たし算（くり上がり）","why":"mmどうしを たして 10を こえたら、10mm を 1cm に くり上げます。cmどうしを たした 数に、その 1cm を たします。","ex":["mm → <em>4+8=12mm → 1cm2mm</em>","cm → <em>23+7=30</em>","あわせて <em>31cm2mm</em>"],"ng":"<b>30cm12mm</b> の まま 書かない。","try":{"t":2,"s":1,"i":1}},"toshi":{"title":"年れいの もんだい","why":"「きょ年 7さい」と 書いて あったら、今は 1つ ふえて 8さい。先に 今の 年れいを 出してから、とし上の 分を たします。しきは 2つ。","ex":["今の わたし → <em>7+1=8</em>","姉は 7さい 上 → <em>8+7=15</em>","こたえ <em>15さい</em>"],"ng":"きょ年の ままで <b>7+7=14</b> と しない。","try":{"t":2,"s":1,"i":2}},"mae_ushiro":{"title":"まえと うしろと 自分","why":"まえの 人と うしろの 人を たしただけでは、自分が 入って いません。さいごに +1 します。○○○○○○ ● ○○○○○ の 図を かくと たしかめられます。","ex":["<em>6+5+1=12</em>","こたえ <em>12人</em>"],"ng":"<b>6+5=11</b> で 止まらない。「ならんで いる 人 ぜんぶ」には 自分も 入る。","try":{"t":2,"s":1,"i":4}}};
  var TYPE_ORDER = ['dochira', 'aida', 'wa', 'sorezore', 'kago', 'nagasa_hiki', 'nagasa_tashi', 'toshi', 'mae_ushiro'];
  var DEFAULT_WEAK = ['dochira', 'aida', 'sorezore'];   // the paper tests' misses, used until records exist
  var MARKS = ['①', '②', '③', '④', '⑤'];

  // ---------- helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function html(tag, cls, h) { var e = el(tag, cls); e.innerHTML = h; return e; }
  function btn(cls, txt, fn) { var b = el('button', cls, txt); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function fmtDay(key) { var p = key.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); return (+p[1]) + '月' + (+p[2]) + '日（' + '日月火水木金土'[d.getDay()] + '）'; }
  function fmtTime(iso) { var d = new Date(iso); return d.getHours() + ':' + pad2(d.getMinutes()); }
  function pct(ok, n) { return n ? Math.round(ok / n * 100) : null; }

  // ---------- problem pool by type ----------
  var POOL = {};
  DATA.tests.forEach(function (t, ti) {
    t.sheets.forEach(function (sh, si) {
      sh.qs.forEach(function (q, qi) {
        var k = t.typeKeys[qi];
        (POOL[k] = POOL[k] || []).push({ q: q, key: k, ti: ti, si: si, qi: qi, ref: t.id + '/' + sh.n + '/' + qi });
      });

  });

  // ---------- storage ----------
  var LS = 'suzu.bunsho.v1', LOGMAX = 500;
  function fresh() {
    var r = { _types: {}, _log: [], _migrated: false };
    DATA.tests.forEach(function (t) { r[t.id] = { test: t.id, sheets: {}, types: {}, updatedAt: null }; });
    return r;
  }
  function load() {

    try { l = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) {}
    for (var k in l) if (k in r) r[k] = l[k];
    if (!r._types) r._types = {};
    if (!r._log) r._log = [];
    if (!r._migrated) {                       // fold the v1 per-test counters into the global type stats
      DATA.tests.forEach(function (t) {
        var pt = (r[t.id] && r[t.id].types) || {};
        for (var i = 1; i <= 5; i++) {
          var c = pt[i]; if (!c) continue;
          var g = r._types[t.typeKeys[i - 1]] || (r._types[t.typeKeys[i - 1]] = { ok: 0, ng: 0 });
          g.ok += c.ok || 0; g.ng += c.ng || 0;

  }
  var recs = load();
  function save() { try { localStorage.setItem(LS, JSON.stringify(recs)); } catch (e) {} }
  function bump(key, ok) { var g = recs._types[key] || (recs._types[key] = { ok: 0, ng: 0 }); g[ok ? 'ok' : 'ng']++; }
  function logAttempt(e) { recs._log.push(e); if (recs._log.length > LOGMAX) recs._log.splice(0, recs._log.length - LOGMAX); }
  function rates() {
    return TYPE_ORDER.map(function (k) {
      var g = recs._types[k] || { ok: 0, ng: 0 }, n = g.ok + g.ng;
      return { key: k, ok: g.ok, ng: g.ng, n: n, rate: n ? g.ok / n : null };
    });
  }
  function isWeak(r) { return r.n >= 2 && r.rate < 0.6; }
  function weakKeys() {

      .sort(function (a, b) { return (a.rate - b.rate) || (b.ng - a.ng); });

  }

  // ---------- answer fields ----------

    return i;
  }
  function buildFields(item) {

    if (a.k === 'len') {
      var cm = numField(''), mm = numField('0');

      row.appendChild(el('span', 'unit', 'が'));
      var n = numField(''); n.dataset.f = 'n';

      var v = numField(''); v.dataset.f = 'n';

      row.appendChild(el('span', 'unit', a.u));

  }
  function val(card, f) {
    var i = card.querySelector('[data-f="' + f + '"]');
    return i && i.value.trim() !== '' ? parseInt(i.value, 10) : null;
  }
  function judgeItem(item) {
    var a = item.q.ans, card = item.card;
    if (a.k === 'len') {
      var cm = val(card, 'cm'), mm = val(card, 'mm');
      if (cm === null) return null;
      return cm === a.cm && (mm === null ? a.mm === 0 : mm === a.mm);
    }
    if (a.k === 'pick') {
      var n = val(card, 'n');
      if (n === null || !item.pick) return null;
      return item.pick === a.pick && n === a.v;

    if (v === null) return null;

  }
  function answerText(a) {
    if (a.k === 'len') return a.cm + 'cm' + (a.mm ? a.mm + 'mm' : '');
    if (a.k === 'pick') return a.pick + 'が ' + a.v + a.u + ' 多い';
    return a.v + a.u;
  }

  // ---------- handwriting pad (vector strokes, redrawn on resize) ----------
  var pads = {}, livePads = [], lastPen = 0;
  function inkColor() { return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#23211d'; }
  function makePad(key) {

    var wrap = el('div', 'pad'), bar = el('div', 'pad-bar'), cv = el('canvas', 'pad-cv');
    var ctx = cv.getContext('2d'), tool = 'pen', cur = null;
    bar.appendChild(el('span', 'pad-lbl', 'ひっさん・図を ここに 書けます'));
    var tools = {};

      var b = el('button', 'tool', t[1]); b.type = 'button';
      b.setAttribute('aria-pressed', String(t[0] === tool));
      b.addEventListener('click', function () { tool = t[0]; for (var k in tools) tools[k].setAttribute('aria-pressed', String(k === tool)); });
      tools[t[0]] = b; bar.appendChild(b);
    });
    var clr = el('button', 'tool clear', 'ぜんぶ けす'); clr.type = 'button';
    clr.addEventListener('click', function () { strokes.length = 0; redraw(); });

    function size() {

    function dot(p, s) { setStyle(s); ctx.beginPath(); ctx.arc(p[0] * cv.width, p[1] * cv.height, s.w * cv.width / 2, 0, Math.PI * 2); ctx.fill(); }
    function redraw() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      strokes.forEach(function (s) { if (s.pts.length < 2) dot(s.pts[0], s); for (var i = 1; i < s.pts.length; i++) seg(s.pts[i - 1], s.pts[i], s); });
    }

    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { livePads.forEach(function (p) { p.redraw(); }); }); } catch (x) {}
  }
  function dropPads(prefix) { for (var k in pads) if (k.indexOf(prefix) === 0) delete pads[k]; }

  // ---------- problem cards ----------

  }

    o.items.forEach(function (it, i) { o.box.appendChild(makeCard(it, i, o.mode + '/' + o.tag + '/' + i, o.mode === 'weak')); });
    cur = o;
    setBar('まるつけ', false);
    $('bar').hidden = false;
  }
  function gradeSet() {
    var o = cur, score = 0, blank = 0, wrong = [];
    o.items.forEach(function (it) {
      var v = judgeItem(it), ok = v === true;
      it.graded = true;
      if (v === null) blank++;
      if (ok) score++; else wrong.push(it.key);
      decorate(it, ok); bump(it.key, ok);
    });
    var now = new Date().toISOString();
    if (o.mode === 'sheet') {
      var t = DATA.tests[o.ti], sh = t.sheets[o.si], rec = recs[t.id];
      var prev = rec.sheets[sh.n] || { tries: 0, best: 0 };
      rec.sheets[sh.n] = { tries: prev.tries + 1, best: Math.max(prev.best, score), last: score, lastAt: now };
      rec.updatedAt = now;

      : '✗の しきを 見て、かんがえ方を たしかめよう。'));
    o.result.appendChild(res);

  }
  $('btnMain').addEventListener('click', function () { if (!cur) return; if (!cur.graded) gradeSet(); else cur.next(); });

  // ---------- views ----------
  var VIEWS = ['home', 'solve', 'weak', 'lessons', 'records', 'print'];
  var TITLES = { home: 'すずドリル', solve: 'プリントを とく', weak: 'にがてを とく', lessons: 'せんせいの ワンポイント', records: 'きろく', print: 'いんさつ' };
  var view = 'home';
  function show(v) {
    view = v;
    VIEWS.forEach(function (n) { $('v-' + n).hidden = n !== v; });
    $('back').hidden = v === 'home';
    $('ttl').textContent = TITLES[v];
    $('tabs').hidden = v !== 'solve';
    $('bar').hidden = !(cur && cur.view === v);
    window.scrollTo(0, 0);
  }
  $('back').addEventListener('click', function () { renderHome(); show('home'); });

  // ---------- home ----------
  var ICONS = {
    solve: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7z"/></svg>',
    weak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
    lessons: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9h8M8 12.5h5" stroke-linecap="round"/></svg>',
    records: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="15" rx="1"/><rect x="17" y="9" width="4" height="12" rx="1"/></svg>',
    print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 13h10v8H7z"/></svg>'
  };
  function todaySummary() {
    var tk = dayKey(new Date().toISOString()), n = 0, ok = 0;
    recs._log.forEach(function (e) { if (dayKey(e.at) === tk) { n += e.total; ok += e.score; } });
    return { n: n, ok: ok };
  }
  function renderHome() {
    var td = todaySummary(), hello = $('hello');
    hello.innerHTML = '';
    if (td.n) { hello.appendChild(el('span', null, 'きょうは ')); hello.appendChild(el('b', null, td.n + '問')); hello.appendChild(el('span', null, ' といて、')); hello.appendChild(el('b', null, td.ok + '問')); hello.appendChild(el('span', null, ' せいかい。')); }
    else hello.textContent = 'きょうは どれから やる？';

    var wk = weakKeys(), weakNames = wk.slice(0, 2).map(function (k) { return TYPES[k].name; }).join('・');
    var box = $('tiles'); box.innerHTML = '';
    [
      ['solve', 'プリントを とく', '1-⑤〜1-⑦　各10まい', true],
      ['weak', 'にがてを とく', weakNames + ' から 5問'],
      ['lessons', 'せんせいの ワンポイント', 'かんがえ方を 9つ。ためして みよう'],
      ['records', 'きろく', 'せいかいりつ・にがて・きょうの けっか'],
      ['print', 'いんさつ', '紙の プリントで やる']
    ].forEach(function (d) {
      var t = btn('tile' + (d[3] ? ' primary' : ''), null, function () { open(d[0]); });
      t.innerHTML = ICONS[d[0]];
      t.appendChild(el('b', null, d[1]));
      t.appendChild(el('span', null, d[2]));
      box.appendChild(t);
    });
  }
  function open(v) {
    if (v === 'solve') { if (!(cur && cur.view === 'solve')) startSheet(); renderTabs(); }
    if (v === 'weak') { if (!(cur && cur.view === 'weak')) renderWeakIntro(); }
    if (v === 'lessons') renderLessons();
    if (v === 'records') renderRecords();
    if (v === 'print') renderPrint();
    show(v);
  }

  // ---------- solve (sheet mode) ----------
  var st = { t: 0, s: 0 };
  function renderTabs() {
    var box = $('tabs'); box.innerHTML = '';
    DATA.tests.forEach(function (t, i) {
      var b = btn('tab', t.label, function () { st.t = i; st.s = 0; startSheet(); });
      b.setAttribute('aria-pressed', String(i === st.t));
      box.appendChild(b);
    });
  }
  function renderChips() {
    var box = $('chips'); box.innerHTML = '';
    var t = DATA.tests[st.t], rec = recs[t.id];
    t.sheets.forEach(function (sh, i) {
      var r = rec.sheets[sh.n], b = btn('chip', null, function () { st.s = i; startSheet(); });
      b.setAttribute('aria-pressed', String(i === st.s));
      b.appendChild(el('span', null, 'No.' + sh.n));
      if (r) { b.classList.add('done'); if (r.best === 5) b.classList.add('full'); b.appendChild(el('small', null, r.best + '/5')); }
      else b.appendChild(el('small', null, '—'));
      box.appendChild(b);
    });
  }
  function startSheet() {
    var t = DATA.tests[st.t], sh = t.sheets[st.s];
    var items = sh.qs.map(function (q, i) { return { q: q, key: t.typeKeys[i], ref: t.id + '/' + sh.n + '/' + i }; });
    renderTabs(); renderChips();
    $('sheetTitle').textContent = t.label + '　No.' + sh.n;
    $('note').textContent = t.note || '';
    startSet({
      view: 'solve', mode: 'sheet', items: items, box: $('qs'), result: $('result'), tag: t.id + '/' + sh.n, ti: st.t, si: st.s,
      nextLabel: function () { return st.s < t.sheets.length - 1 ? 'つぎの プリント →' : 'さいしょに もどる'; },
      next: function () { st.s = st.s < t.sheets.length - 1 ? st.s + 1 : 0; startSheet(); window.scrollTo(0, 0); },
      again: function () { dropPads('sheet/' + t.id + '/' + sh.n + '/'); startSheet(); }
    });
  }

  // ---------- weak mode ----------
  var lastWeakItems = null;
  function buildWeakItems(keys) {
    var counts = keys.length === 1 ? [5] : keys.length === 2 ? [3, 2] : [2, 2, 1], used = {}, items = [];
    keys.forEach(function (k, idx) {
      var pool = shuffle((POOL[k] || []).slice()), need = counts[idx] || 0;
      for (var i = 0; i < pool.length && need > 0; i++) { if (used[pool[i].ref]) continue; used[pool[i].ref] = 1; items.push({ q: pool[i].q, key: k, ref: pool[i].ref }); need--; }
    });
    return shuffle(items);
  }
  function renderWeakIntro(fixedKey) {
    var keys = fixedKey ? [fixedKey] : weakKeys(), box = $('wintro');
    box.hidden = false; $('wqs').innerHTML = ''; $('wresult').innerHTML = '';
    cur = null; $('bar').hidden = true;
    box.innerHTML = '';
    var p = el('div', 'panel');
    p.appendChild(el('h3', null, fixedKey ? 'この 型を 5問' : 'いま にがてな 型'));
    var rs = {}; rates().forEach(function (r) { rs[r.key] = r; });
    var list = el('div', 'klist');
    keys.forEach(function (k) {
      var r = rs[k], row = el('div', 'krow');
      row.appendChild(el('span', null, TYPES[k].name));
      var rt = el('span', 'rate' + (isWeak(r) ? ' weak' : ''), r.n ? r.n + '回中 ' + r.ok + '回 せいかい' : 'まだ といて いない');
      row.appendChild(rt);
      list.appendChild(row);
    });
    p.appendChild(list);
    var hasRecords = rates().some(function (r) { return r.n >= 2; });
    p.appendChild(el('p', 'muted', fixedKey ? 'まちがえたら せんせいの ワンポイントに もどれます。'
      : hasRecords ? 'せいかいりつの ひくい 型から、ランダムに 5問 えらびます。' : 'まだ きろくが 少ないので、学校の テストで まちがえた 型から 出します。'));
    p.appendChild(btn('btn', '5問 スタート', function () { startWeak(keys); }));
    box.appendChild(p);
  }
  function startWeak(keys, items) {
    items = items || buildWeakItems(keys);
    lastWeakItems = items;
    $('wintro').hidden = true;
    var tag = String(Date.now());
    startSet({
      view: 'weak', mode: 'weak', items: items, keys: keys, box: $('wqs'), result: $('wresult'), tag: tag,
      nextLabel: function () { return 'べつの 5問 →'; },
      next: function () { startWeak(keys); },
      again: function () { dropPads('weak/' + tag + '/'); startWeak(keys, items.map(function (it) { return { q: it.q, key: it.key, ref: it.ref }; })); }
    });
    show('weak');
  }

  // ---------- lessons ----------
  function renderLessons() {
    var box = $('llist'); box.innerHTML = ''; box.hidden = false; $('ldetail').hidden = true;
    var rs = {}; rates().forEach(function (r) { rs[r.key] = r; });
    var order = TYPE_ORDER.slice().sort(function (a, b) { var wa = isWeak(rs[a]) ? 0 : 1, wb = isWeak(rs[b]) ? 0 : 1; return wa - wb; });
    box.appendChild(el('p', 'hello', 'まちがえやすい ところを、せんせいが 1つずつ せつめいします。'));
    var list = el('div', 'llist');
    order.forEach(function (k, i) {
      var r = rs[k], row = btn('lrow', null, function () { openLesson(k); });
      row.appendChild(el('span', 'n', String(i + 1)));
      row.appendChild(el('span', null, LESSONS[k].title));
      row.appendChild(el('span', 'st' + (isWeak(r) ? ' weak' : ''), isWeak(r) ? 'にがて ' + pct(r.ok, r.n) + '%' : r.n ? pct(r.ok, r.n) + '%' : ''));
      list.appendChild(row);
    });
    box.appendChild(list);
  }
  function openLesson(key) {
    var L = LESSONS[key], d = $('ldetail');
    $('llist').hidden = true; d.hidden = false; d.innerHTML = '';
    cur = null; $('bar').hidden = true;
    d.appendChild(el('span', 'eyebrow', 'せんせいの ワンポイント'));
    d.appendChild(el('h2', null, L.title));
    d.appendChild(el('p', 'why', L.why));
    var ex = el('div', 'ex'); ex.appendChild(el('div', 'h', 'れい'));
    L.ex.forEach(function (line) { ex.appendChild(html('div', null, line)); });
    d.appendChild(ex);
    d.appendChild(html('p', 'ng', '✗ よくある まちがい　' + L.ng));

    var tr = el('div', 'try');
    tr.appendChild(el('h2', 'sec', 'ためして みよう'));
    var t = DATA.tests[L.try.t], sh = t.sheets[L.try.s], q = sh.qs[L.try.i];
    var item = { q: q, key: key, ref: t.id + '/' + sh.n + '/' + L.try.i };
    livePads.length = 0;
    dropPads('lesson/' + key + '/');
    tr.appendChild(makeCard(item, 0, 'lesson/' + key + '/0', false));
    var acts = el('div', 'actions');
    var check = btn('btn sm', 'こたえあわせ', function () {
      var v = judgeItem(item);
      if (v === null) { alert('こたえを 入れてね。'); return; }
      var ok = v === true;
      item.graded = true; decorate(item, ok); bump(key, ok);
      logAttempt({ at: new Date().toISOString(), mode: 'lesson', keys: [key], score: ok ? 1 : 0, total: 1, wrong: ok ? [] : [key] });
      save();
      check.hidden = true;
      acts.appendChild(btn('btn sm', 'この 型を 5問 れんしゅう', function () { renderWeakIntro(key); show('weak'); }));
      acts.appendChild(btn('btn sm ghost', 'もういちど', function () { openLesson(key); }));
    });
    acts.appendChild(check);
    acts.appendChild(btn('btn sm ghost', 'こうざの 一らんへ', function () { renderLessons(); }));
    tr.appendChild(acts);
    d.appendChild(tr);
    show('lessons');
    window.scrollTo(0, 0);
  }

  // ---------- records ----------
  function renderRecords() {
    var box = $('recs'); box.innerHTML = '';
    var log = recs._log.slice(), total = 0, okAll = 0;
    log.forEach(function (e) { total += e.total; okAll += e.score; });
    var td = todaySummary();

    var stats = el('div', 'stats');
    [[String(total), '問', 'といた もんだい'], [total ? pct(okAll, total) + '' : '—', total ? '%' : '', 'せいかいりつ'], [td.n ? td.ok + '/' + td.n : '—', '', 'きょう']].forEach(function (s) {
      var c = el('div', 'stat'); var b = el('b', null, s[0]); if (s[1]) b.appendChild(el('i', null, s[1])); c.appendChild(b); c.appendChild(el('span', null, s[2])); stats.appendChild(c);
    });
    box.appendChild(stats);

    box.appendChild(html('h2', 'sec', '型べつ <small>タップで せんせいの ワンポイント</small>'));
    var rs = rates().slice().sort(function (a, b) { var ra = a.rate === null ? 2 : a.rate, rb = b.rate === null ? 2 : b.rate; return ra - rb; });
    rs.forEach(function (r) {
      var row = btn('trow', null, function () { openLesson(r.key); });
      var nm = el('span', 'nm', TYPES[r.key].name);
      if (isWeak(r)) nm.appendChild(el('span', 'pill', 'にがて'));
      row.appendChild(nm);
      row.appendChild(el('span', 'rt', r.n ? r.n + '回中 ' + r.ok + '回（' + pct(r.ok, r.n) + '%）' : 'まだ'));
      var bg = el('div', 'bar-bg'), fg = el('div', 'bar-fg' + (isWeak(r) ? ' weak' : ''));
      fg.style.width = (r.n ? pct(r.ok, r.n) : 0) + '%';
      bg.appendChild(fg); row.appendChild(bg);
      box.appendChild(row);
    });

    box.appendChild(html('h2', 'sec', 'プリントべつ <small>いちばん よかった てん</small>'));
    DATA.tests.forEach(function (t) {
      box.appendChild(el('p', 'muted', t.label));
      var g = el('div', 'grid5');
      t.sheets.forEach(function (sh) {
        var r = recs[t.id].sheets[sh.n], c = el('div', 'cell' + (r ? (r.best === 5 ? ' full' : '') : ' none'));
        c.appendChild(el('span', null, 'No.' + sh.n)); c.appendChild(el('b', null, r ? r.best + '/5' : '—'));
        g.appendChild(c);
      });
      box.appendChild(g);
    });

    box.appendChild(html('h2', 'sec', '日づけべつ <small>さいきん 30日</small>'));
    if (!log.length) box.appendChild(el('p', 'muted', 'まだ きろくが ありません。'));
    var days = {}, keys = [];
    log.reverse().forEach(function (e) { var k = dayKey(e.at); if (!days[k]) { days[k] = []; keys.push(k); } days[k].push(e); });
    keys.slice(0, 30).forEach(function (k) {
      var d = el('div', 'day'); d.appendChild(el('h4', null, fmtDay(k)));
      days[k].forEach(function (e) {
        var row = el('div', 'lg');
        row.appendChild(el('span', 'tm', fmtTime(e.at)));
        row.appendChild(el('span', 'wh', e.mode === 'sheet' ? e.test.replace('1-', '1-') + '　No.' + e.sheet : e.mode === 'weak' ? 'にがて' : 'ワンポイント'));
        if (e.wrong && e.wrong.length) row.appendChild(el('span', 'wr', '✗ ' + e.wrong.map(function (k2) { return TYPES[k2] ? TYPES[k2].name : k2; }).join('・')));
        row.appendChild(el('span', 'sc' + (e.score === e.total ? ' all' : ''), e.score + '/' + e.total));
        d.appendChild(row);
      });
      box.appendChild(d);
    });

    var acts = el('div', 'rec-actions');
    acts.appendChild(btn('linkbtn', 'きろくを 書き出す', exportRecords));
    acts.appendChild(btn('linkbtn shu', 'きろくを ぜんぶ けす', function () {
      if (!confirm('きろくを ぜんぶ けします。よろしいですか？')) return;
      recs = fresh(); recs._migrated = true; save(); renderRecords();
    }));
    box.appendChild(acts);
  }
  function exportRecords() {
    var payload = JSON.stringify({ app: 'すずドリル', exportedAt: new Date().toISOString(), records: recs }, null, 2);
    var name = 'suzu-drill-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      var file = new File([payload], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'すずドリル きろく' }).catch(function () {}); return; }
    } catch (e) {}
    var done = function () { alert('きろくを コピーしました。メモなどに はりつけて 送ってください。'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(payload).then(done, function () { prompt('この 内容を コピーしてください', payload); });
    else prompt('この 内容を コピーしてください', payload);
  }

  // ---------- print ----------
  var pst = { t: 0, s: 0, src: 'sheet', ans: false };
  var PDF = [['problems', 'もんだい 10まい'], ['answers', 'こたえ'], ['points', 'ポイント'], ['all', 'ぜんぶ']];
  function renderPrint() {
    var c = $('pctl'); c.innerHTML = '';
    var src = el('div', 'src');
    var sheetBtn = btn('tab', 'プリントから えらぶ', function () { pst.src = 'sheet'; renderPrint(); });
    var weakBtn = btn('tab', 'さっきの にがて 5問', function () { pst.src = 'weak'; renderPrint(); });
    sheetBtn.setAttribute('aria-pressed', String(pst.src === 'sheet')); weakBtn.setAttribute('aria-pressed', String(pst.src === 'weak'));
    weakBtn.disabled = !lastWeakItems;
    src.appendChild(sheetBtn); if (lastWeakItems) src.appendChild(weakBtn);
    src.className = 'tabs inpage src'; c.appendChild(src);

    if (pst.src === 'sheet') {
      var tabs = el('div', 'tabs inpage'); tabs.style.margin = '12px 0 0';
      DATA.tests.forEach(function (t, i) { var b = btn('tab', t.label, function () { pst.t = i; pst.s = 0; renderPrint(); }); b.setAttribute('aria-pressed', String(i === pst.t)); tabs.appendChild(b); });
      c.appendChild(tabs);
      var row = el('div', 'pick-row'); row.style.marginTop = '10px';
      DATA.tests[pst.t].sheets.forEach(function (sh, i) { var b = btn('chip', null, function () { pst.s = i; renderPrint(); }); b.setAttribute('aria-pressed', String(i === pst.s)); b.appendChild(el('span', null, 'No.' + sh.n)); row.appendChild(b); });
      c.appendChild(row);
    }
    var opt = el('div', 'opt-row');
    var lab = el('label'); var cb = el('input'); cb.type = 'checkbox'; cb.checked = pst.ans;
    cb.addEventListener('change', function () { pst.ans = cb.checked; buildPreview(); });
    lab.appendChild(cb); lab.appendChild(el('span', null, 'こたえの ページも つける')); opt.appendChild(lab);
    opt.appendChild(btn('btn sm', '印刷する', doPrint));
    c.appendChild(opt);
    c.appendChild(el('p', 'muted', 'iPadでは、印刷ボタンで うまく いかない ときは、下の PDF を ひらいて 共有ボタン → プリント を つかってください。'));

    var pd = $('pdfs'); pd.innerHTML = '';
    pd.appendChild(html('h2', 'sec', 'PDF で ひらく <small>Safariで ひらきます</small>'));
    DATA.tests.forEach(function (t) {
      var r = el('div', 'rowp'); r.appendChild(el('b', null, t.label));
      PDF.forEach(function (p) { var a = el('a', null, p[1]); a.href = './pdf/' + t.id + '/' + p[0] + '.pdf'; a.target = '_blank'; a.rel = 'noopener'; r.appendChild(a); });
      pd.appendChild(r);
    });
    buildPreview();
  }
  function buildPSheet(title, no, items) {
    var s = el('div', 'psheet');
    var head = el('div', 'head'); head.appendChild(el('h2', 'ttl', title)); head.appendChild(el('div', 'no', no)); s.appendChild(head);
    s.appendChild(html('div', 'meta', '日づけ　<span class="fill d">&nbsp;</span>月<span class="fill d">&nbsp;</span>日<span style="flex:1;display:flex;align-items:baseline;gap:2mm">なまえ　<span class="fill nm">&nbsp;</span></span><span class="sc">てんすう　　　／' + items.length + '</span>'));
    var probs = el('div', 'probs');
    items.forEach(function (it, i) {
      var p = el('div', 'p'), pt = el('div', 'pt');
      pt.appendChild(el('span', 'pn', MARKS[i] || String(i + 1))); pt.appendChild(el('span', null, it.q.t)); p.appendChild(pt);
      var lines = el('div', 'lines');
      lines.appendChild(html('div', 'ln', '<span class="lbl">（しき）</span><span class="rule"></span>'));
      lines.appendChild(html('div', 'ln ans', '<span class="lbl">こたえ</span><span class="rule"></span>'));
      p.appendChild(lines);
      p.appendChild(html('div', 'hs', '<span>（ひっさん・図）</span>'));
      probs.appendChild(p);
    });
    s.appendChild(probs);
    return s;
  }
  function buildAnswerSheet(title, no, items) {
    var s = el('div', 'psheet');
    var head = el('div', 'head'); head.appendChild(el('h2', 'ttl', 'こたえ　' + title)); head.appendChild(el('div', 'no', no)); s.appendChild(head);
    var ak = el('div', 'ak'); ak.appendChild(el('h4', null, no));
    var tb = el('table');
    items.forEach(function (it, i) {
      var tr = el('tr');
      tr.appendChild(el('td', 'cn', MARKS[i] || String(i + 1)));
      tr.appendChild(el('td', 'cs', it.q.s.join('　→　')));
      tr.appendChild(el('td', 'ca', answerText(it.q.ans)));
      tb.appendChild(tr);
    });
    ak.appendChild(tb); s.appendChild(ak);
    return s;
  }
  function currentPrintSet() {
    if (pst.src === 'weak' && lastWeakItems) return { title: 'にがて れんしゅう', no: 'にがて', items: lastWeakItems };
    var t = DATA.tests[pst.t], sh = t.sheets[pst.s];
    return { title: '2年　文しょうだい　れんしゅう（' + t.label + '）', no: 'No.' + sh.n, items: sh.qs.map(function (q) { return { q: q }; }) };
  }
  function buildPreview() {
    var a = $('printArea'), set = currentPrintSet();
    a.innerHTML = '';
    a.appendChild(buildPSheet(set.title, set.no, set.items));
    if (pst.ans) a.appendChild(buildAnswerSheet(set.title, set.no, set.items));
    fitPreview();
  }
  function fitPreview() {
    var a = $('printArea'); if (a.hidden || !a.firstChild) return;
    var avail = Math.min(document.documentElement.clientWidth, 794 + 28) - 28;
    a.style.zoom = avail < 794 ? (avail / 794).toFixed(3) : '1';
  }
  window.addEventListener('resize', fitPreview);
  function doPrint() {
    document.body.classList.add('print-mode');
    var off = function () { document.body.classList.remove('print-mode'); };
    window.addEventListener('afterprint', off, { once: true });
    setTimeout(off, 8000);
    window.print();
  }

  // ---------- boot ----------
  renderHome(); show('home');
})();
</script>
