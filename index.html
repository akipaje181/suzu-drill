<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すずドリル</title>
<meta name="description" content="2年生 文しょうだい 自動まるつけ">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f6f2e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="すずドリル">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">

<style>
  html{color-scheme:light dark}
  body{margin:0}
  [hidden]{display:none !important}
  img{max-width:100%}
  .linkbtn{background:none; border:0; padding:6px 10px; font:inherit; font-size:12px; color:var(--ink-faint); text-decoration:underline; cursor:pointer}
  :root{
    --paper:#ffffff;
    --ground:#f2eee4;
    --ink:#23211d;
    --ink-soft:#6f695d;
    --ink-faint:#9c9587;
    --rule:#ded7c6;
    --rule-soft:#ece6d8;
    --shu:#d4453a;
    --shu-ink:#c0392f;
    --shu-wash:#fbeeec;
    --ok-wash:#f0f4ec;
    --ok-ink:#3f7a52;
    --bar:#2e2b25;
    --bar-ink:#f3efe4;
    --field:#fdfcf8;
    --field-line:#c8c0ad;
    --grid:#e4ddcc;
    --f-round:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
    --f-kaku:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#27241f; --ground:#1a1815; --ink:#efeade; --ink-soft:#a9a293; --ink-faint:#7d7768;
      --rule:#403b32; --rule-soft:#332f28; --shu:#ef6b60; --shu-ink:#f08076; --shu-wash:#3a2723;
      --ok-wash:#22301f; --ok-ink:#8fc79f; --bar:#efeade; --bar-ink:#23211d;
      --field:#201e19; --field-line:#4d4739; --grid:#3a3529;
    }
  }
  :root[data-theme="dark"]{
    --paper:#27241f; --ground:#1a1815; --ink:#efeade; --ink-soft:#a9a293; --ink-faint:#7d7768;
    --rule:#403b32; --rule-soft:#332f28; --shu:#ef6b60; --shu-ink:#f08076; --shu-wash:#3a2723;
    --ok-wash:#22301f; --ok-ink:#8fc79f; --bar:#efeade; --bar-ink:#23211d;
    --field:#201e19; --field-line:#4d4739; --grid:#3a3529;
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--f-kaku); line-height:1.7;
    margin:0; padding:0 0 108px;
    -webkit-text-size-adjust:100%;
  }
  button, input{font:inherit; color:inherit; touch-action:manipulation}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--shu); outline-offset:2px}

  .wrap{max-width:760px; margin:0 auto; padding:0 14px}

  /* ---------- header ---------- */
  .top{background:var(--bar); color:var(--bar-ink); padding:12px 0 10px}
  .top .wrap{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .top h1{font-family:var(--f-round); font-size:18px; font-weight:700; margin:0; letter-spacing:.04em}
  .tabs{display:flex; gap:6px; margin-left:auto}
  .tab{
    font-family:var(--f-round); font-size:15px; font-weight:500;
    background:transparent; color:var(--bar-ink); opacity:.62;
    border:1.5px solid currentColor; border-radius:999px; padding:6px 14px; min-height:38px;
  }
  .tab[aria-pressed="true"]{opacity:1; background:var(--shu); border-color:var(--shu); color:#fff}

  /* ---------- sheet picker ---------- */
  .pick{background:var(--paper); border-bottom:1px solid var(--rule)}
  .pick .wrap{padding-top:10px; padding-bottom:10px}
  .pick-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
  .chip{
    flex:none; width:56px; height:56px; border-radius:12px;
    border:1.5px solid var(--rule); background:var(--field);
    font-family:var(--f-round); font-size:15px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .chip small{font-family:var(--f-kaku); font-size:10px; font-weight:500; color:var(--ink-faint); line-height:1}
  .chip.done small{color:var(--ok-ink)}
  .chip.full{border-color:var(--ok-ink)}
  .chip[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}
  .chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
  .weak{
    margin-top:9px; font-size:13px; color:var(--ink-soft);
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  .weak b{color:var(--shu-ink); font-family:var(--f-round)}

  /* ---------- problems ---------- */
  .sheet-hd{
    display:flex; align-items:baseline; gap:10px; margin:18px 0 10px;
    font-family:var(--f-round);
  }
  .sheet-hd h2{font-size:19px; font-weight:700; margin:0}
  .sheet-hd span{font-size:13px; color:var(--ink-soft); font-family:var(--f-kaku)}

  .q{
    background:var(--paper); border:1px solid var(--rule); border-radius:12px;
    padding:14px 15px 15px; margin-bottom:12px; position:relative;
  }
  .q-hd{display:flex; align-items:flex-start; gap:9px}
  .q-n{
    flex:none; width:30px; height:30px; border-radius:50%;
    border:2px solid var(--shu); color:var(--shu-ink);
    font-family:var(--f-round); font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .q-t{font-family:var(--f-round); font-size:16.5px; line-height:1.85; line-break:strict; flex:1}

  .row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:13px 0 0 39px}
  .row .lbl{font-family:var(--f-round); font-size:15px; color:var(--ink-soft); flex:none}
  .num{
    width:96px; height:52px; text-align:center;
    font-family:var(--f-round); font-size:22px; font-weight:700;
    background:var(--field); border:2px solid var(--field-line); border-radius:10px;
  }
  .num::placeholder{color:var(--ink-faint); font-weight:400; font-size:16px}
  .unit{font-family:var(--f-round); font-size:17px; font-weight:500}
  .opts{display:flex; gap:8px; flex-wrap:wrap}
  .opt{
    font-family:var(--f-round); font-size:16px; font-weight:500; min-height:52px;
    padding:8px 16px; border-radius:10px;
    border:2px solid var(--field-line); background:var(--field);
  }
  .opt[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}

  /* ---------- handwriting pad ---------- */
  .pad{margin:12px 0 0; border:1.5px dashed var(--field-line); border-radius:10px; overflow:hidden; background:var(--field)}
  .pad-bar{display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px dashed var(--rule)}
  .pad-lbl{font-family:var(--f-round); font-size:12.5px; color:var(--ink-faint); margin-right:auto; padding-left:2px}
  .tool{
    min-height:38px; padding:4px 13px; border-radius:8px; font-size:14px; font-family:var(--f-round);
    border:1.5px solid var(--field-line); background:var(--paper); color:var(--ink);
  }
  .tool[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .tool.clear{color:var(--shu-ink)}
  .pad-cv{
    display:block; width:100%; height:200px; touch-action:none; user-select:none; -webkit-user-select:none;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:30px 30px; background-position:-1px -1px;
  }
  .q.graded .pad{opacity:.9}

  /* ---------- marking ---------- */
  .q.ok{border-color:var(--ok-ink)}
  .q.ng{border-color:var(--shu); background:var(--shu-wash)}
  .mark{
    position:absolute; top:10px; right:12px;
    font-size:34px; line-height:1; font-weight:700;
  }
  .mark.o{width:32px; height:32px; border:4px solid var(--ok-ink); border-radius:50%; top:12px}
  .mark.x{color:var(--shu-ink)}
  .q.graded .num, .q.graded .opt{pointer-events:none}
  .q.ng .num, .q.ng .opt{border-color:var(--shu); opacity:.75}

  .fix{
    margin:12px 0 0 39px; padding:11px 13px; border-radius:9px;
    background:var(--paper); border:1px dashed var(--shu);
    font-family:var(--f-round); font-size:15px; line-height:1.8;
  }
  .fix .k{color:var(--ink-soft); font-size:13px; font-family:var(--f-kaku); margin-right:6px}
  .fix .a{color:var(--shu-ink); font-weight:700; font-size:17px}
  .fix .st{display:block; margin-top:4px; color:var(--ink-soft); font-size:14px}
  .fix .st em{font-style:normal; color:var(--ink); font-weight:500}

  /* ---------- result + action bar ---------- */
  .score{
    background:var(--paper); border:1px solid var(--rule); border-radius:12px;
    padding:14px 16px; margin-bottom:12px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .score .big{font-family:var(--f-round); font-size:30px; font-weight:700; line-height:1}
  .score .big i{font-style:normal; font-size:17px; color:var(--ink-soft)}
  .score .msg{font-family:var(--f-round); font-size:16px; flex:1; min-width:140px}
  .score.all .big{color:var(--ok-ink)}

  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--paper); border-top:1px solid var(--rule);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .bar .wrap{display:flex; gap:10px; padding:0}
  .btn{
    flex:1; min-height:56px; border-radius:12px; border:2px solid var(--shu);
    background:var(--shu); color:#fff;
    font-family:var(--f-round); font-size:19px; font-weight:700;
  }
  .btn.ghost{background:transparent; color:var(--shu-ink)}
  .btn[disabled]{opacity:.4}

  .note{font-size:12px; color:var(--ink-faint); text-align:center; margin:18px 0 6px}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <h1>すずドリル</h1>
  <div class="tabs" id="tabs"></div>
</div></div>

<div class="pick"><div class="wrap">
  <div class="pick-row" id="chips"></div>
  <div class="weak" id="weak"></div>
</div></div>

<div class="wrap">
  <div class="sheet-hd"><h2 id="sheetTitle">No.1</h2><span id="sheetSub">こたえを 入れて、まるつけを おしてね</span></div>
  <div id="result"></div>
  <div id="qs"></div>
  <p class="note" id="note"></p>
  <p class="note"><button type="button" class="linkbtn" id="btnExport">きろくを 書き出す</button></p>
</div>

<div class="bar"><div class="wrap">
  <button class="btn ghost" id="btnAgain" hidden>もういちど</button>
  <button class="btn" id="btnMain">まるつけ</button>
</div></div>

<script>
(function () {

  // ---------- storage: localStorage now, db when the viewer grants it ----------
  var LS = 'suzu.bunsho.v1';
  var db = null;
  var recs = {};                       // {testId: record}

  function blank(id) { return { test: id, sheets: {}, types: {}, updatedAt: null }; }
  function tries(r) { var n = 0; for (var k in r.sheets) n += r.sheets[k].tries || 0; return n; }

  function readLocal() {
    try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { return {}; }
  }
  function writeLocal() {
    try { localStorage.setItem(LS, JSON.stringify(recs)); } catch (e) {}
  }
  DATA.tests.forEach(function (t) { recs[t.id] = blank(t.id); });
  (function () {
    var l = readLocal();
    for (var k in l) if (recs[k]) recs[k] = l[k];
  })();

  function persist(testId) {
    writeLocal();
    if (db) db.doc('records/' + testId).set(recs[testId]).catch(function () {});
  }

  (window.claude && typeof claude.use === 'function' ? claude.use('db') : Promise.resolve(null)).then(function (d) {
    if (!d) return;                                   // design for absence
    db = d;
    DATA.tests.forEach(function (t) {
      db.doc('records/' + t.id).get().then(function (snap) {
        if (snap.exists) {
          var remote = snap.data();
          if (tries(remote) >= tries(recs[t.id])) { recs[t.id] = remote; writeLocal(); render(); }
          else db.doc('records/' + t.id).set(recs[t.id]).catch(function () {});
        } else if (tries(recs[t.id])) {
          db.doc('records/' + t.id).set(recs[t.id]).catch(function () {});
        }
      }).catch(function () {});
    });
  }).catch(function () {});

  // ---------- state ----------
  var st = { t: 0, s: 0, graded: false, picks: {} };

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function test() { return DATA.tests[st.t]; }
  function sheet() { return test().sheets[st.s]; }

  // ---------- answer fields ----------
  function numField(ph) {
    var i = el('input', 'num');
    i.type = 'text'; i.inputMode = 'numeric'; i.autocomplete = 'off';
    i.setAttribute('pattern', '[0-9]*');
    i.placeholder = ph || '';
    i.addEventListener('input', function () {
      this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
    });
    return i;
  }

  function buildFields(q, i) {
    var row = el('div', 'row'), a = q.ans;
    row.appendChild(el('span', 'lbl', 'こたえ'));

    if (a.k === 'len') {
      var cm = numField(''), mm = numField('0');
      cm.dataset.f = 'cm'; mm.dataset.f = 'mm';
      row.appendChild(cm); row.appendChild(el('span', 'unit', 'cm'));
      row.appendChild(mm); row.appendChild(el('span', 'unit', 'mm'));
    } else if (a.k === 'pick') {
      var box = el('div', 'opts');
      a.opts.forEach(function (o) {
        var b = el('button', 'opt', o);
        b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.dataset.opt = o;
        b.addEventListener('click', function () {
          if (st.graded) return;
          st.picks[i] = o;
          Array.prototype.forEach.call(box.children, function (c) {
            c.setAttribute('aria-pressed', String(c.dataset.opt === o));
          });
        });
        box.appendChild(b);
      });
      row.appendChild(box);
      row.appendChild(el('span', 'unit', 'が'));
      var n = numField(''); n.dataset.f = 'n';
      row.appendChild(n);
      row.appendChild(el('span', 'unit', a.u + ' 多い'));
    } else {
      var v = numField(''); v.dataset.f = 'n';
      row.appendChild(v);
      row.appendChild(el('span', 'unit', a.u));
    }
    return row;
  }

  function val(card, f) {
    var i = card.querySelector('[data-f="' + f + '"]');
    return i && i.value.trim() !== '' ? parseInt(i.value, 10) : null;
  }

  function judge(card, q, i) {
    var a = q.ans;
    if (a.k === 'len') {
      var cm = val(card, 'cm'), mm = val(card, 'mm');
      if (cm === null) return null;
      return cm === a.cm && (mm === null ? a.mm === 0 : mm === a.mm);
    }
    if (a.k === 'pick') {
      var n = val(card, 'n'), p = st.picks[i];
      if (n === null || !p) return null;
      return p === a.pick && n === a.v;
    }
    var v = val(card, 'n');
    if (v === null) return null;
    return v === a.v;
  }

  function answerText(a) {
    if (a.k === 'len') return a.cm + 'cm' + (a.mm ? a.mm + 'mm' : '');
    if (a.k === 'pick') return a.pick + 'が ' + a.v + a.u + ' 多い';
    return a.v + a.u;
  }

  // ---------- handwriting pad (vector strokes, redrawn on resize) ----------
  var pads = {};            // key -> strokes kept while the page is open
  var livePads = [];
  var lastPen = 0;
  function inkColor() {
    return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#23211d';
  }
  function makePad(key) {
    var strokes = pads[key] || (pads[key] = []);
    var wrap = el('div', 'pad'), bar = el('div', 'pad-bar'), cv = el('canvas', 'pad-cv');
    var ctx = cv.getContext('2d'), tool = 'pen', cur = null;

    bar.appendChild(el('span', 'pad-lbl', 'ひっさん・図を ここに 書けます'));
    var tools = {};
    [['pen', 'ペン'], ['eraser', 'けしゴム']].forEach(function (t) {
      var b = el('button', 'tool', t[1]); b.type = 'button';
      b.setAttribute('aria-pressed', String(t[0] === tool));
      b.addEventListener('click', function () {
        tool = t[0];
        for (var k in tools) tools[k].setAttribute('aria-pressed', String(k === tool));
      });
      tools[t[0]] = b; bar.appendChild(b);
    });
    var clr = el('button', 'tool clear', 'ぜんぶ けす'); clr.type = 'button';
    clr.addEventListener('click', function () { strokes.length = 0; redraw(); });
    bar.appendChild(clr);
    wrap.appendChild(bar); wrap.appendChild(cv);

    function size() {
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (!r.width) return;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      redraw();
    }
    function setStyle(s) {
      ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      ctx.lineWidth = s.w * cv.width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = ctx.fillStyle = inkColor();
    }
    function seg(a, b, s) {
      setStyle(s);
      ctx.beginPath();
      ctx.moveTo(a[0] * cv.width, a[1] * cv.height);
      ctx.lineTo(b[0] * cv.width, b[1] * cv.height);
      ctx.stroke();
    }
    function dot(p, s) {
      setStyle(s);
      ctx.beginPath();
      ctx.arc(p[0] * cv.width, p[1] * cv.height, s.w * cv.width / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    function redraw() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      strokes.forEach(function (s) {
        if (s.pts.length < 2) dot(s.pts[0], s);
        for (var i = 1; i < s.pts.length; i++) seg(s.pts[i - 1], s.pts[i], s);
      });
    }
    function norm(e) {
      var r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
    }
    function allowed(e) {
      if (e.pointerType === 'pen') { lastPen = Date.now(); return true; }
      if (e.pointerType === 'touch' && Date.now() - lastPen < 1500) return false;   // palm while penning
      return true;
    }
    cv.addEventListener('pointerdown', function (e) {
      if (!allowed(e)) return;
      e.preventDefault();
      cur = { erase: tool === 'eraser', w: tool === 'eraser' ? 0.04 : 0.0045, pts: [norm(e)] };
      strokes.push(cur);
      dot(cur.pts[0], cur);
      try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    });
    cv.addEventListener('pointermove', function (e) {
      if (!cur || !allowed(e)) return;
      var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      if (!evs.length) evs = [e];
      evs.forEach(function (ev) {
        var p = norm(ev), prev = cur.pts[cur.pts.length - 1];
        cur.pts.push(p); seg(prev, p, cur);
      });
    });
    function end() { cur = null; }
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('lostpointercapture', end);

    livePads.push({ size: size, redraw: redraw });
    requestAnimationFrame(size);
    return wrap;
  }
  window.addEventListener('resize', function () { livePads.forEach(function (p) { p.size(); }); });
  if (window.matchMedia) {
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      livePads.forEach(function (p) { p.redraw(); });
    }); } catch (x) {}
  }
  function padKey(i) { return test().id + '/' + sheet().n + '/' + i; }

  // ---------- render ----------
  function renderTabs() {
    var box = $('tabs'); box.innerHTML = '';
    DATA.tests.forEach(function (t, i) {
      var b = el('button', 'tab', t.label);
      b.type = 'button'; b.setAttribute('aria-pressed', String(i === st.t));
      b.addEventListener('click', function () { st.t = i; st.s = 0; reset(); });
      box.appendChild(b);
    });
  }

  function renderChips() {
    var box = $('chips'); box.innerHTML = '';
    var rec = recs[test().id];
    test().sheets.forEach(function (sh, i) {
      var r = rec.sheets[sh.n], b = el('button', 'chip');
      b.type = 'button'; b.setAttribute('aria-pressed', String(i === st.s));
      b.appendChild(el('span', null, 'No.' + sh.n));
      if (r) {
        b.classList.add('done');
        if (r.best === 5) b.classList.add('full');
        b.appendChild(el('small', null, r.best + '/5'));
      } else {
        b.appendChild(el('small', null, '—'));
      }
      b.addEventListener('click', function () { st.s = i; reset(); });
      box.appendChild(b);
    });
  }

  function renderWeak() {
    var box = $('weak'), rec = recs[test().id], types = test().types;
    box.innerHTML = '';
    var worst = null;
    for (var k = 1; k <= 5; k++) {
      var c = rec.types[k];
      if (!c || (c.ok + c.ng) < 2) continue;
      if (!worst || c.ng > worst.ng) worst = { i: k, ng: c.ng, all: c.ok + c.ng };
    }
    if (worst && worst.ng > 0) {
      box.appendChild(el('span', null, 'よく まちがえる：'));
      box.appendChild(el('b', null, '（' + worst.i + '）' + types[worst.i - 1]));
      box.appendChild(el('span', null, worst.all + '回中 ' + worst.ng + '回'));
    } else {
      box.appendChild(el('span', null, 'といた きろくが たまると、にがてな もんだいが ここに 出ます。'));
    }
  }

  function renderSheet() {
    var sh = sheet(), box = $('qs');
    livePads.length = 0;
    box.innerHTML = ''; $('result').innerHTML = '';
    $('sheetTitle').textContent = 'No.' + sh.n;
    $('sheetSub').textContent = 'こたえを 入れて、まるつけを おしてね';
    var marks = ['①', '②', '③', '④', '⑤'];

    sh.qs.forEach(function (q, i) {
      var card = el('div', 'q');
      card.dataset.i = i;
      var hd = el('div', 'q-hd');
      hd.appendChild(el('span', 'q-n', marks[i]));
      hd.appendChild(el('p', 'q-t', q.t));
      card.appendChild(hd);
      card.appendChild(makePad(padKey(i)));
      card.appendChild(buildFields(q, i));
      box.appendChild(card);
    });

    $('btnAgain').hidden = true;
    $('btnMain').textContent = 'まるつけ';
    $('note').textContent = DATA.tests[st.t].note;
    window.scrollTo(0, 0);
  }

  function reset() {
    st.graded = false; st.picks = {};
    renderTabs(); renderChips(); renderWeak(); renderSheet();
  }
  function render() { renderChips(); renderWeak(); }

  // ---------- grading ----------
  function grade() {
    var sh = sheet(), cards = $('qs').children, score = 0, blankCount = 0;
    var rec = recs[test().id];

    Array.prototype.forEach.call(cards, function (card, i) {
      var q = sh.qs[i], v = judge(card, q, i);
      card.classList.add('graded');
      if (v === null) blankCount++;
      var ok = v === true;
      card.classList.add(ok ? 'ok' : 'ng');
      card.appendChild(el('span', 'mark ' + (ok ? 'o' : 'x'), ok ? '' : '✗'));
      if (ok) score++;

      if (!ok) {
        var fix = el('div', 'fix');
        fix.appendChild(el('span', 'k', 'こたえ'));
        fix.appendChild(el('span', 'a', answerText(q.ans)));
        var st2 = el('span', 'st');
        st2.appendChild(el('span', null, 'しき　'));
        q.s.forEach(function (f, k) {
          if (k) st2.appendChild(el('span', null, '　→　'));
          var em = el('em', null, f); st2.appendChild(em);
        });
        fix.appendChild(st2);
        card.appendChild(fix);
      }

      var c = rec.types[i + 1] || (rec.types[i + 1] = { ok: 0, ng: 0 });
      c[ok ? 'ok' : 'ng']++;
    });

    var prev = rec.sheets[sh.n] || { tries: 0, best: 0 };
    rec.sheets[sh.n] = {
      tries: prev.tries + 1,
      best: Math.max(prev.best, score),
      last: score,
      lastAt: new Date().toISOString()
    };
    rec.updatedAt = new Date().toISOString();
    persist(test().id);

    var res = el('div', 'score' + (score === 5 ? ' all' : ''));
    var big = el('div', 'big', String(score));
    big.appendChild(el('i', null, ' / 5'));
    res.appendChild(big);
    res.appendChild(el('div', 'msg',
      score === 5 ? 'ぜんもん せいかい！ よくできました。'
      : blankCount ? 'まだ 入れて いない ところが あるよ。'
      : score >= 3 ? 'おしい！ ✗の しきを 見て、もういちど やってみよう。'
      : '✗の しきを 見て、かんがえ方を たしかめよう。'));
    $('result').appendChild(res);

    st.graded = true;
    $('btnAgain').hidden = false;
    $('btnMain').textContent = st.s < test().sheets.length - 1 ? 'つぎの プリント →' : 'さいしょに もどる';
    renderChips(); renderWeak();
    window.scrollTo(0, 0);
  }

  $('btnMain').addEventListener('click', function () {
    if (!st.graded) return grade();
    st.s = st.s < test().sheets.length - 1 ? st.s + 1 : 0;
    reset();
  });
  $('btnAgain').addEventListener('click', function () {
    for (var i = 0; i < 5; i++) delete pads[padKey(i)];
    reset();
  });

  reset();
})();
</script>

<script>
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }

  var LS = "suzu.bunsho.v1";
  var btn = document.getElementById('btnExport');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var raw = '{}';
    try { raw = localStorage.getItem(LS) || '{}'; } catch (e) {}
    var payload = JSON.stringify({ app: 'すずドリル', exportedAt: new Date().toISOString(), records: JSON.parse(raw) }, null, 2);
    var name = 'suzu-drill-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      var file = new File([payload], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'すずドリル きろく' }).catch(function () {});
        return;
      }
    } catch (e) {}
    var done = function () { alert('きろくを コピーしました。メモなどに はりつけて 送ってください。'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(done, function () { prompt('この 内容を コピーしてください', payload); });
    } else {
      prompt('この 内容を コピーしてください', payload);
    }
  });
})();
</script>
